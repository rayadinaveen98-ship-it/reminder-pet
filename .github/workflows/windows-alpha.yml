name: Build Windows Alpha
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-alpha:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Static XAML / project checks
        run: python tools/validate_project.py
      - name: Core reminder tests
        run: dotnet run --project tests/PetPing.CoreChecks/PetPing.CoreChecks.csproj -c Release
      - name: Build portable Windows EXE
        run: dotnet publish desktop/PetPing.Windows/PetPing.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o artifacts/PetPing-Windows-v0.15
      - name: Upload unsigned alpha
        uses: actions/upload-artifact@v4
        with:
          name: PetPing-Windows-v0.15-unsigned
          path: artifacts/PetPing-Windows-v0.15/
          if-no-files-found: error
          retention-days: 7

      - name: Install Inno Setup compiler (free)
        shell: pwsh
        run: choco install innosetup --yes --no-progress --limit-output
      - name: Build per-user Windows installer
        shell: pwsh
        run: |
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "/Q" "installer\PetPing.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno installer compilation failed" }
          if (!(Test-Path "artifacts\PetPing-Installer-v0.15\PetPing-Setup-v0.15-unsigned.exe")) {
            throw "Expected installer artifact was not created"
          }
      # Pin and rebuild the real predecessor: avoids relying on expiring CI ZIPs.
      - name: Test v0.14 to v0.15 upgrade preserves reminders and pet profiles
        shell: pwsh
        run: |
          $oldRoot = Join-Path $env:RUNNER_TEMP "PetPing-Previous-v014"
          git worktree add --detach "$oldRoot" "4f8be7cae20651161651bbec444f412fa34902df"
          if ($LASTEXITCODE -ne 0) { throw "Cannot check out pinned v0.14" }
          $oldPublish = Join-Path $oldRoot "artifacts\PetPing-Windows-v0.14"
          dotnet publish (Join-Path $oldRoot "desktop\PetPing.Windows\PetPing.Windows.csproj") -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o "$oldPublish"
          if ($LASTEXITCODE -ne 0) { throw "Cannot publish v0.14" }
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $compiler "/Q" (Join-Path $oldRoot "installer\PetPing.iss")
          if ($LASTEXITCODE -ne 0) { throw "Cannot build v0.14 installer" }
          $oldSetup = Join-Path $oldRoot "artifacts\PetPing-Installer-v0.14\PetPing-Setup-v0.14-unsigned.exe"
          $newSetup = (Resolve-Path "artifacts\PetPing-Installer-v0.15\PetPing-Setup-v0.15-unsigned.exe").Path
          if (!(Test-Path $oldSetup)) { throw "Missing v0.14 setup" }
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\PetPing-CI-Upgrade"
          $dataDir = Join-Path $env:LOCALAPPDATA "PetPing"
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $installArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + $installDir + '"'))
          $oldInstall = Start-Process -FilePath $oldSetup -ArgumentList $installArgs -Wait -PassThru
          if ($oldInstall.ExitCode -ne 0) { throw "v0.14 install failed" }
          if (!(Test-Path (Join-Path $installDir "PetPing.Windows.exe"))) { throw "v0.14 binary missing" }
          $reminders = Join-Path $dataDir "reminders.json"
          $profiles = Join-Path $dataDir "pet-profile.json"
          $fixture = ConvertTo-Json -InputObject @(
            @{ Id='11111111-1111-4111-8111-111111111111'; Title='Upgrade check'; DueAt='2028-10-25T18:00:00+05:30'; OriginalDueAt='2028-10-25T18:00:00+05:30'; Status='Pending'; Repeat='None'; SnoozeCount=0; RepeatContinuationCreated=$false }
          ) -Depth 5
          [System.IO.File]::WriteAllText($reminders, $fixture)
          $profileObjects = @('Cat', 'Dog', 'Bunny') | ForEach-Object {
            @{ SchemaVersion=1; Species=$_; Palette='Apricot'; Accessory='None'; Size='Medium'; Personality='Playful'; Effects='Playful'; DoneAction='Hop'; SnoozeAction='Yawn'; RepeatSpeechSeconds=60 }
          }
          $roster = @{ SchemaVersion=1; SelectedSpecies='Bunny'; Profiles=$profileObjects } | ConvertTo-Json -Depth 6
          [System.IO.File]::WriteAllText($profiles, $roster)
          $reminderHash = (Get-FileHash $reminders -Algorithm SHA256).Hash
          $profileHash = (Get-FileHash $profiles -Algorithm SHA256).Hash
          $newInstall = Start-Process -FilePath $newSetup -ArgumentList $installArgs -Wait -PassThru
          if ($newInstall.ExitCode -ne 0) { throw "v0.15 upgrade failed" }
          if (!(Test-Path (Join-Path $installDir "PetPing.Windows.exe"))) { throw "Upgraded binary missing" }
          if ((Get-FileHash $reminders -Algorithm SHA256).Hash -ne $reminderHash -or
              (Get-FileHash $profiles -Algorithm SHA256).Hash -ne $profileHash) {
            throw "v0.14 -> v0.15 upgrade changed reminder or pet data"
          }
          $uninstall = Join-Path $installDir "unins000.exe"
          if (!(Test-Path $uninstall)) { throw "Upgraded uninstaller missing" }
          $removed = Start-Process -FilePath $uninstall -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($removed.ExitCode -ne 0) { throw "Uninstall failed" }
          if ((Get-FileHash $reminders -Algorithm SHA256).Hash -ne $reminderHash -or
              (Get-FileHash $profiles -Algorithm SHA256).Hash -ne $profileHash) {
            throw "Uninstall changed user data"
          }
          Remove-Item $reminders,$profiles -Force
          Write-Host "PASS: real v0.14-to-v0.15 upgrade and uninstall preserved saved data."

      - name: Validate installed files and preserve reminder data
        shell: pwsh
        run: |
          $installer = (Resolve-Path "artifacts\PetPing-Installer-v0.15\PetPing-Setup-v0.15-unsigned.exe").Path
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\PetPing-CI"
          $dataDir = Join-Path $env:LOCALAPPDATA "PetPing"
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $sentinel = Join-Path $dataDir "ci-preserve-test.txt"
          Set-Content -LiteralPath $sentinel -Value "retain reminder data"
          $installArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installDir`"")
          $installed = Start-Process -FilePath $installer -ArgumentList $installArgs -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Silent installer returned $($installed.ExitCode)" }
          if (!(Test-Path (Join-Path $installDir "PetPing.Windows.exe"))) {
            throw "Installer failed to lay down executable"
          }
          # Exercise the real Inno Setup upgrade/repair code path by running
          # the same version again. This does NOT replace cross-version QA.
          $reinstalled = Start-Process -FilePath $installer -ArgumentList $installArgs -Wait -PassThru
          if ($reinstalled.ExitCode -ne 0) { throw "Reinstall returned $($reinstalled.ExitCode)" }
          if (!(Test-Path (Join-Path $installDir "PetPing.Windows.exe"))) {
            throw "Reinstall removed installed executable"
          }
          if (!(Test-Path $sentinel)) {
            throw "Reinstall changed the user's LocalAppData reminder data"
          }
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (!(Test-Path $uninstaller)) { throw "Uninstaller missing" }
          $uninstalled = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstalled.ExitCode -ne 0) { throw "Silent uninstaller returned $($uninstalled.ExitCode)" }
          if (!(Test-Path $sentinel)) { throw "Installer removed user reminder data" }
          Remove-Item $sentinel -Force
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PetPing-Installer-v0.15-unsigned
          path: artifacts/PetPing-Installer-v0.15/PetPing-Setup-v0.15-unsigned.exe
          if-no-files-found: error
          retention-days: 7
