name: Build Windows Experimental Preview
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-alpha:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Static XAML / project checks
        run: python tools/validate_project.py
      - name: Core reminder tests
        run: dotnet run --project tests/PetPing.CoreChecks/PetPing.CoreChecks.csproj -c Release
      - name: Build portable Windows EXE
        run: dotnet publish desktop/PetPing.Windows/PetPing.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o artifacts/PetPing-Windows-v0.18-experimental
      - name: Validate seven-size Companion Beacon app icon
        shell: pwsh
        run: |
          $iconFile = "desktop/PetPing.Windows/Assets/PetPing.ico"
          if (!(Test-Path $iconFile)) { throw "Generated Companion Beacon ICO is missing" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $iconFile).Path)
          if ($bytes.Length -lt 1000 -or [BitConverter]::ToUInt16($bytes, 2) -ne 1 -or
              [BitConverter]::ToUInt16($bytes, 4) -ne 7) {
            throw "Invalid brand ICO header or incomplete multi-size icon"
          }
          $expected = @(16, 24, 32, 48, 64, 128, 0)
          foreach ($i in 0..6) {
            $entry = 6 + 16 * $i
            if ([int]$bytes[$entry] -ne $expected[$i] -or
                [int]$bytes[$entry + 1] -ne $expected[$i]) {
              throw "Missing Companion Beacon ICO frame: entry $i"
            }
            $pngSize = [BitConverter]::ToUInt32($bytes, $entry + 8)
            $pngOffset = [BitConverter]::ToUInt32($bytes, $entry + 12)
            if ($pngSize -lt 100 -or ($pngOffset + $pngSize) -gt $bytes.Length) {
              throw "ICO PNG frame offset invalid: entry $i"
            }
            if ($bytes[$pngOffset] -ne 137 -or $bytes[$pngOffset + 1] -ne 80) {
              throw "ICO entry $i is not a PNG frame"
            }
          }
          Write-Host "PASS: multi-resolution original Companion Beacon ICO validated"
      - name: Upload unsigned alpha
        uses: actions/upload-artifact@v4
        with:
          name: PetPing-Windows-v0.18-experimental-unsigned
          path: artifacts/PetPing-Windows-v0.18-experimental/
          if-no-files-found: error
          retention-days: 7

      - name: Install Inno Setup compiler (free)
        shell: pwsh
        run: choco install innosetup --yes --no-progress --limit-output
      - name: Build per-user Windows installer
        shell: pwsh
        run: |
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "/Q" "installer\PetPing.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno installer compilation failed" }
          if (!(Test-Path "artifacts\PetPing-Installer-v0.18-experimental\PetPing-Setup-v0.18-experimental-unsigned.exe")) {
            throw "Expected installer artifact was not created"
          }
      # Experimental uses its OWN AppId, install folder and local data root.
      # Never upgrade/replace v0.17 or exercise the production AppId here.
      - name: Verify experimental installer preserves production and test data
        shell: pwsh
        run: |
          $setup = (Resolve-Path "artifacts\PetPing-Installer-v0.18-experimental\PetPing-Setup-v0.18-experimental-unsigned.exe").Path
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\PetPing-CI-Experimental"
          $prodDir = Join-Path $env:LOCALAPPDATA "PetPing"
          $expDir = Join-Path $env:LOCALAPPDATA "PetPing-Experimental"
          New-Item -ItemType Directory -Force $prodDir,$expDir | Out-Null
          $production = Join-Path $prodDir "reminders.json"
          $prodProfiles = Join-Path $prodDir "pet-profile.json"
          $experimental = Join-Path $expDir "reminders.json"
          $expProfiles = Join-Path $expDir "pet-profile.json"
          [System.IO.File]::WriteAllText($production,'[{"Id":"11111111-1111-4111-8111-111111111111","Title":"Keep production","Repeat":"None"}]')
          [System.IO.File]::WriteAllText($prodProfiles,'{"SchemaVersion":1,"SelectedSpecies":"Cat"}')
          [System.IO.File]::WriteAllText($experimental,'[]')
          [System.IO.File]::WriteAllText($expProfiles,'{"SchemaVersion":1,"SelectedSpecies":"Dog"}')
          $files = @($production,$prodProfiles,$experimental,$expProfiles)
          $hashes = @($files | ForEach-Object { (Get-FileHash $_ -Algorithm SHA256).Hash })
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $installDir + '"'))
          $first = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
          if ($first.ExitCode -ne 0) { throw "Experimental install failed" }
          $exe = Join-Path $installDir 'PetPing.Windows.exe'
          if (!(Test-Path $exe)) { throw "Experimental executable missing" }
          $version = (Get-Item $exe).VersionInfo.FileVersion
          if ($version -notlike '0.18.0*') { throw "Incorrect experimental app version: $version" }
          $again = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
          if ($again.ExitCode -ne 0) { throw "Experimental reinstall failed" }
          for ($i = 0; $i -lt $files.Count; $i++) {
            if ((Get-FileHash $files[$i] -Algorithm SHA256).Hash -ne $hashes[$i]) {
              throw "Installer modified production or experiment reminder data: $($files[$i])"
            }
          }
          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (!(Test-Path $uninstaller)) { throw "Experimental uninstaller missing" }
          $removed = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($removed.ExitCode -ne 0) { throw "Experimental uninstall failed" }
          for ($i = 0; $i -lt $files.Count; $i++) {
            if ((Get-FileHash $files[$i] -Algorithm SHA256).Hash -ne $hashes[$i]) {
              throw "Experimental uninstall modified reminder data: $($files[$i])"
            }
          }
          Remove-Item $files -Force
          Write-Host "PASS: v0.18 experiment installed and removed without affecting production or experimental data."

      - name: Validate installed files and preserve reminder data
        shell: pwsh
        run: |
          $installer = (Resolve-Path "artifacts\PetPing-Installer-v0.18-experimental\PetPing-Setup-v0.18-experimental-unsigned.exe").Path
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\PetPing-CI"
          $dataDir = Join-Path $env:LOCALAPPDATA "PetPing-Experimental"
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $sentinel = Join-Path $dataDir "ci-preserve-test.txt"
          Set-Content -LiteralPath $sentinel -Value "retain reminder data"
          $installArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installDir`"")
          $installed = Start-Process -FilePath $installer -ArgumentList $installArgs -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Silent installer returned $($installed.ExitCode)" }
          if (!(Test-Path (Join-Path $installDir "PetPing.Windows.exe"))) {
            throw "Installer failed to lay down executable"
          }
          # Exercise the real Inno Setup upgrade/repair code path by running
          # the same version again. This does NOT replace cross-version QA.
          $reinstalled = Start-Process -FilePath $installer -ArgumentList $installArgs -Wait -PassThru
          if ($reinstalled.ExitCode -ne 0) { throw "Reinstall returned $($reinstalled.ExitCode)" }
          if (!(Test-Path (Join-Path $installDir "PetPing.Windows.exe"))) {
            throw "Reinstall removed installed executable"
          }
          if (!(Test-Path $sentinel)) {
            throw "Reinstall changed the user's LocalAppData reminder data"
          }
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (!(Test-Path $uninstaller)) { throw "Uninstaller missing" }
          $uninstalled = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstalled.ExitCode -ne 0) { throw "Silent uninstaller returned $($uninstalled.ExitCode)" }
          if (!(Test-Path $sentinel)) { throw "Installer removed user reminder data" }
          Remove-Item $sentinel -Force
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PetPing-Installer-v0.18-experimental-unsigned
          path: artifacts/PetPing-Installer-v0.18-experimental/PetPing-Setup-v0.18-experimental-unsigned.exe
          if-no-files-found: error
          retention-days: 7
