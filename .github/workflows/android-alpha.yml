name: Android Alpha APK
on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-alpha.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-alpha.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify GitHub runner Android SDK
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || which sdkmanager
          echo "Android SDK: $ANDROID_HOME"
      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run Android unit tests
        run: gradle -p android :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Compile debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Upload Android alpha APK
        uses: actions/upload-artifact@v4
        with:
          name: PetPing-Android-v0.1-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
